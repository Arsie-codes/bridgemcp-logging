[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bridgemcp-logging"
version = "0.1.0"
description = "Structured invocation logging for BridgeMCP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Muhammad Arslan" }
]
keywords = ["mcp", "logging", "bridgemcp", "model-context-protocol", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "bridgemcp-py>=0.2.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "black>=24.0",
    "pyright>=1.1",
]

[project.urls]
Homepage = "https://github.com/Arsie-codes/bridgemcp-logging"
Repository = "https://github.com/Arsie-codes/bridgemcp-logging"
Issues = "https://github.com/Arsie-codes/bridgemcp-logging/issues"

[tool.hatch.build.targets.wheel]
packages = ["bridgemcp_logging"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
